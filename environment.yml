# MiuraCognitive - Entorno conda (multiplataforma: Windows / Linux / macOS)
#
# Crear con:    conda env create -f environment.yml
# Activar con:  conda activate miuracognitive
#
# PyTorch con soporte Blackwell (sm_120) requiere wheel cu128+, por eso lo
# instalamos via pip dentro del env conda.

name: miuracognitive
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - git

  # Cientifico
  - numpy=1.26.*
  - scipy=1.13.*
  - matplotlib=3.9.*
  - pandas=2.2.*

  # Jupyter
  - jupyterlab
  - ipywidgets

  # PyTorch CUDA 12.8 + resto de dependencias via pip
  - pip:
    - --index-url https://download.pytorch.org/whl/cu128
    - torch==2.7.0
    - torchvision
    - torchaudio
    - --index-url https://pypi.org/simple
    - tiktoken==0.7.0
    - datasets==2.20.0
    - wandb==0.17.5
    - tqdm==4.66.4
    - einops==0.8.0
    - pytest==8.3.2
